<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Performance: Resource Prioritization -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- Critical Translation Preload -->
  <link rel="preload" href="/locales/en/common.json" as="fetch" crossorigin />
  <link rel="preload" href="/locales/en/pages.json" as="fetch" crossorigin />
  <link rel="preload" href="/locales/ar/common.json" as="fetch" crossorigin />
  <link rel="preload" href="/locales/ar/pages.json" as="fetch" crossorigin />

  <!-- Critical Fonts -->
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    as="style" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" />
  </noscript>

  <style>
    /* Critical Loading Styles */
    :root {
      --uniteda-emerald: #064e3b;
      --uniteda-emerald-dark: #022c22;
      --uniteda-gold: #b6985a;
      --background: #fafafa;
    }

    body {
      margin: 0;
      background: var(--background);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* Initial Layout Primitives to prevent FOIT/CLS */
    .hero-placeholder {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: var(--background);
    }

    /* Products Page LCP Optimization */
    .products-hero-container {
      content-visibility: auto;
      contain-intrinsic-size: 1px 500px;
    }

    /* Prevent content jump before hydration */
    [data-framer-appear-id] {
      opacity: 0;
    }

    .hydrated [data-framer-appear-id] {
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: auto;
    }

    .hydrated .loader-wrapper {
      opacity: 0;
      pointer-events: none;
    }

    .loader-content {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-ring {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid rgba(6, 78, 59, 0.1);
      border-top-color: var(--uniteda-emerald);
      animation: spin 1.2s linear infinite;
    }

    .loader-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }
  </style>

  <meta name="description"
    content="UNITED - The specialized B2B Food & Agricultural Supply Hub for the Egyptian market. Professional food supply procurement and industrial scale logistics based in Cairo." />
  <meta name="keywords"
    content="food supply, agricultural hub, B2B food supply, Egypt food supply, local agricultural hub, sustainable farming, wholesale fruits vegetables, Cairo logistics" />

  <!-- OpenGraph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://united-ffv.com/" />
  <meta property="og:title" content="Uniteda - Advanced Agricultural Supply HUB" />
  <meta property="og:description"
    content="Enterprise-grade food supply chain solutions. Providing the Egyptian market with premium agricultural produce through high-efficiency logistics." />
  <meta property="og:image" content="/og-image.webp" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://united-ffv.com/" />
  <meta property="twitter:title" content="Uniteda - Advanced Agricultural Supply HUB" />
  <meta property="twitter:description"
    content="Enterprise-grade food supply chain solutions. Providing the Egyptian market with premium agricultural produce." />
  <meta property="twitter:image" content="/og-image.webp" />

  <link rel="icon" type="image/svg+xml" href="/logo.webp" />
  <title>Uniteda | Advanced B2B Agricultural Supply HUB</title>
</head>

<body>
  <!-- Global Loader -->
  <div class="loader-wrapper" id="global-loader">
    <div class="loader-content">
      <div class="loader-ring"></div>
      <img src="/logo.webp" class="loader-logo" alt="Loading...">
    </div>
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Trigger fade-out when React signals mount
    window.addEventListener('react-mounted', () => {
      document.body.classList.add('hydrated');
      setTimeout(() => {
        const bp = document.getElementById('hero-bp-persistent');
        if (bp) bp.style.display = 'none';
      }, 1100);
    });
  </script>
</body>

</html>
